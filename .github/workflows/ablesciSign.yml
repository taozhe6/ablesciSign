name: AbleSci Auto Sign

on:
  workflow_dispatch:
  schedule:
    - cron: '40 13,23 * * *'  # UTC时间(北京时间为21:40和次日7:40)

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show masked configuration
        env:
          GITHUB_ACTIONS: true
          ABLESCI_ACCOUNTS: ${{ secrets.ABLESCI_ACCOUNTS }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import platform
          from ablesci import get_accounts, protect_privacy
          import sendNotify

          print("===== 当前配置（脱敏） =====")
          print(f"Python: {platform.python_version()}; Runner: {os.getenv('RUNNER_OS', '')}")
          print(f"触发方式: {os.getenv('GITHUB_EVENT_NAME', '')}")
          print(f"分支: {os.getenv('GITHUB_REF_NAME', '')}; 提交: {os.getenv('GITHUB_SHA', '')[:12]}")
          for name in ("ABLESCI_ACCOUNTS", "SCKEY", "XZKEY", "PUSH_PLUS_TOKEN"):
              state = "已配置（内容隐藏）" if os.getenv(name) else "未配置"
              print(f"{name}: {state}")
          accounts = get_accounts()
          print(f"有效账号数: {len(accounts)}")
          for index, (email, password) in enumerate(accounts, 1):
              password_state = "已配置（内容隐藏）" if password else "未配置"
              print(f"账号 {index}: {protect_privacy(email)}; 密码: {password_state}")
          print(f"PushPlus channel: {sendNotify.PUSH_PLUS_CHANNEL}")
          webhook_state = "已配置（内容隐藏）" if sendNotify.PUSH_PLUS_WEBHOOK else "未配置"
          print(f"PushPlus webhook: {webhook_state}")
          print("===== 配置摘要结束 =====")
          PY

      - name: Run AbleSci Sign
        id: sign
        run: python ablesci.py
        env:
          GITHUB_ACTIONS: true
          ABLESCI_ACCOUNTS: ${{ secrets.ABLESCI_ACCOUNTS }}
          # 选择一种通知服务
          # SCKEY: ${{ secrets.SCKEY }}          # Server酱
          # XZKEY: ${{ secrets.XZKEY }}        # 息知 (按需启用)
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }} # PushPlus (按需启用)

      - name: Keep-alive push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Last run: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') (北京时间)" > last_run.txt
          git add last_run.txt
          git diff --cached --quiet || (git commit -m "chore: keep-alive [skip ci]" && git push)
